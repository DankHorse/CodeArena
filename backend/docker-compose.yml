services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in backend/.env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in backend/.env}
      DOGFOOD_BASE_URL: http://127.0.0.1:8002
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8001"
    volumes:
      - ../fixtures.json:/fixtures/fixtures.json:ro
      - ../.dogfood.local.toml:/demo/.dogfood.local.toml
    restart: unless-stopped

volumes:
  postgres_data:
